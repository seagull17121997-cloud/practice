
name: QA Test Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run QA test
        run: |
          echo "Starting QA tests..."
          test -f README.md
          echo "Test PASSED: README.md exists"
